<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Corrida</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

h1 { text-align: center; }

.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
}

input, button, select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

button {
  background: #38bdf8;
  cursor: pointer;
}

.item {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #334155;
  padding: 5px;
}
</style>
</head>

<body>

<h1>🏎️ Sistema de Corrida</h1>

<div class="container">

<!-- CORREDORES -->
<div class="card">
  <h2>🏎️ Corredores</h2>

  <input id="nomeCorredor" placeholder="Nome do corredor">
  <button onclick="criarCorredor()">Cadastrar</button>

  <div id="listaCorredores"></div>
</div>

<!-- VOLTAS -->
<div class="card">
  <h2>⏱️ Registrar Volta</h2>

  <select id="selectCorredor"></select>
  <input id="tempoVolta" placeholder="Tempo (ex: 72.345)">
  <button onclick="registrarVolta()">Registrar</button>
</div>

<!-- DASHBOARD -->
<div class="card">
  <h2>🥇 Melhor Volta</h2>
  <p id="melhorVolta"></p>
</div>

<div class="card">
  <h2>🏆 Ranking</h2>
  <div id="ranking"></div>
</div>

</div>

<script>
const API = 'http://localhost:3000';
const token = localStorage.getItem('token');

function headers() {
  return {
    'Content-Type': 'application/json',
    'Authorization': token
  };
}

// =========================
// CORREDORES
// =========================
async function carregarCorredores() {
  const res = await fetch(`${API}/corredores`, { headers: headers() });
  const data = await res.json();

  const lista = document.getElementById('listaCorredores');
  const select = document.getElementById('selectCorredor');

  lista.innerHTML = '';
  select.innerHTML = '';

  data.forEach(c => {
    lista.innerHTML += `<div class="item">${c.nome}</div>`;
    select.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
  });
}

async function criarCorredor() {
  const nome = document.getElementById('nomeCorredor').value;

  await fetch(`${API}/corredores`, {
    method: 'POST',
    headers: headers(),
    body: JSON.stringify({ nome })
  });

  carregarCorredores();
}

// =========================
// VOLTAS
// =========================
async function registrarVolta() {
  const corredor_id = document.getElementById('selectCorredor').value;
  const tempo = document.getElementById('tempoVolta').value;

  await fetch(`${API}/voltas`, {
    method: 'POST',
    headers: headers(),
    body: JSON.stringify({ corredor_id, tempo })
  });

  carregarDashboard();
}

// =========================
// DASHBOARD
// =========================
async function carregarDashboard() {
  // melhor volta
  const melhor = await fetch(`${API}/dashboard/melhor-volta`, { headers: headers() });
  const melhorData = await melhor.json();

  document.getElementById('melhorVolta').innerHTML =
    `${melhorData.nome} - ${melhorData.melhor_volta}s`;

  // ranking
  const rankingRes = await fetch(`${API}/dashboard/ranking`, { headers: headers() });
  const rankingData = await rankingRes.json();

  const div = document.getElementById('ranking');
  div.innerHTML = '';

  rankingData.forEach((c, i) => {
    div.innerHTML += `
      <div class="item">
        <span>#${i + 1} ${c.nome}</span>
        <span>${c.total}s</span>
      </div>
    `;
  });
}

// =========================
// INIT
// =========================
carregarCorredores();
carregarDashboard();
</script>

</body>
</html>
